[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "suedangrim-rubricaction"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出评分标准的可操作化上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "suedangrim" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://suedangrim.github.io"
Repository = "https://github.com/suedangrim/rubricaction"
Issues = "https://github.com/suedangrim/rubricaction/issues"

[project.scripts]
rubricaction = "rubricaction:main"

[tool.setuptools]
py-modules = ["rubricaction"]
